<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cricket Live</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:#122321;font:16px Arial}header{background:#102b27;color:#fff;padding:24px 7%;font-weight:bold;letter-spacing:2px}.green{color:#b9ed5c}main{max-width:1050px;margin:auto;padding:55px 24px}.eyebrow{color:#71807c;letter-spacing:2px;font-size:12px}h1{font-size:44px;margin:12px 0}.venue,.muted{color:#71807c}.score{background:#113833;color:#fff;padding:36px 48px;margin-top:36px;border-radius:6px}.score small{color:#b9cfc8;letter-spacing:2px}.runs{font:68px monospace;color:#b9ed5c;margin:15px 0 6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.card{background:#fff;border:1px solid #e1e8e5;border-radius:6px;padding:28px}.card h2{margin-top:0}.buttons{display:flex;gap:8px;flex-wrap:wrap}.buttons button{padding:13px 18px;border:1px solid #cbd8d3;background:#f8fbfa;border-radius:4px;font-weight:bold;cursor:pointer}.buttons button:hover{background:#dff5a8}.wicket{background:#e7684d!important;color:#fff;border-color:#e7684d!important}.player{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #edf0ef}@media(max-width:700px){h1{font-size:34px}.grid{grid-template-columns:1fr}.score{padding:28px 22px}}</style></head><body><header>● CRICKET<span class="green">LIVE</span></header><main><p class="eyebrow">LIVE · T20 MATCH</p><h1>India vs Australia</h1><p class="venue">Mumbai • Wankhede Stadium</p><section class="score"><small>INDIA · BATTING</small><div class="runs" id="runs">70/0</div><div id="overs">11.4 / 20.0 OVERS</div></section><div class="grid"><section class="card"><h2>Live scoring</h2><p class="muted">Click a delivery to update the score.</p><div class="buttons"><button onclick="score(0)">0</button><button onclick="score(1)">1</button><button onclick="score(2)">2</button><button onclick="score(3)">3</button><button onclick="score(4)">4</button><button onclick="score(6)">6</button><button class="wicket" onclick="score(0,true)">WICKET</button></div></section><section class="card"><h2>Match status</h2><div class="player"><span>Batting team</span><b>India</b></div><div class="player"><span>Bowling team</span><b>Australia</b></div><div class="player"><span>Venue</span><b>Wankhede</b></div><p id="status" class="muted">Dashboard ready</p></section></div></main><script>let runs=70,wickets=0,balls=70;function score(n,w=false){runs+=n;balls++;if(w)wickets++;document.getElementById('runs').textContent=runs+'/'+wickets;document.getElementById('overs').textContent=Math.floor(balls/6)+'.'+balls%6+' / 20.0 OVERS';document.getElementById('status').textContent='Updated just now'}</script></body></html>
